        <h1 style="font-weight:500;line-height:1.1">As time goes on, we&rsquo;re not getting farther from the text. We&rsquo;re getting closer.</h1>
        <p>This site makes the case that the New Testament text has been transmitted reliably: it was copied through many independent lines rather than one chain; the earliest known copies have moved more than a thousand years closer to the originals since 1516; the famous disputed passages are few and are printed in the footnotes; the Gospels&rsquo; personal names fit first-century Palestine; and the Gospels interlock in ways no one arranged. Every chart also shows what skeptics say.</p>
        <p>The interactive charts need JavaScript. The sources are:</p>
        <ul>
          <li>INTF Kurzgefasste Liste, <a href="https://ntvmr.uni-muenster.de/liste">ntvmr.uni-muenster.de/liste</a></li>
          <li>Bruce Metzger &amp; Bart Ehrman, <i>The Text of the New Testament</i>, 4th ed. (2005)</li>
          <li>Robert B. Stewart (ed.), <i>The Reliability of the New Testament: Ehrman and Wallace in Dialogue</i> (2011)</li>
          <li>Tal Ilan, <i>Lexicon of Jewish Names in Late Antiquity</i> (2002); Richard Bauckham, <i>Jesus and the Eyewitnesses</i>, 2nd ed. (2017)</li>
          <li>Lydia McGrew, <i>Hidden in Plain View</i> (2017); Bart Ehrman, <i>Misquoting Jesus</i> (2005)</li>
          <li>Data files and code: <a href="https://github.com/LexReach/closer-not-farther">github.com/LexReach/closer-not-farther</a></li>
        </ul>

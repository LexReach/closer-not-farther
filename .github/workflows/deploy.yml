name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      # Requires Settings → Pages → Source: GitHub Actions (the workflow token cannot enable Pages).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Opens the live site in a real browser and checks the Reader, the evidence
  # panel (once present), the Why page and the Library. Screenshots are kept
  # as an artifact. A failure here turns the run red.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      # The Witness view's typographic page for P66 John 1, Sinaiticus John 18 and Vaticanus Mark 16.
      - run: node scripts/witness-check.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      # The Hebrew Bible: Hebrew column, meaning card, OT evidence panel and Witness view, coverage switch.
      - run: node scripts/ot-check.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke/
